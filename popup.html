<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 150px;
      padding: 10px;
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 12px;
    }
    .setting-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .checkbox {
      appearance: none;
      width: 16px;
      height: 16px;
      border: 2px solid #9aa0a6;
      border-radius: 4px;
      display: grid;
      place-content: center;
      cursor: pointer;
      transition: border-color 0.2s, background-color 0.2s;
    }
    .checkbox::before {
      content: '';
      width: 10px;
      height: 10px;
      transform: scale(0);
      transition: transform 0.1s ease-in-out;
      clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 13%, 80% 0, 43% 62%);
      background-color: #fff;
    }
    .checkbox:checked {
      background-color: #34a853;
      border-color: #34a853;
    }
    .checkbox:checked::before {
      transform: scale(1);
    }
    label {
      user-select: none;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="setting-row">
    <input type="checkbox" id="showButtonsCheckbox" class="checkbox" checked>
    <label for="showButtonsCheckbox">Show export buttons on tables</label>
  </div>
  <script src="popup.js"></script>
</body>
</html>
